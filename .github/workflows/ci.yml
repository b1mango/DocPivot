name: CI

on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: workers/ocr/requirements-dev.lock

      - name: Verify architecture alignment
        shell: pwsh
        run: ./eng/verify-project.ps1

      - name: Restore pinned PDF engines
        shell: pwsh
        run: ./eng/restore-vendor.ps1

      - name: Verify dependency licenses
        shell: pwsh
        run: ./eng/verify-licenses.ps1

      - name: Build .NET solution
        shell: pwsh
        run: ./eng/build.ps1 -Configuration Release

      - name: Test .NET solution
        shell: pwsh
        run: ./eng/test.ps1 -Configuration Release

      - name: Capture and validate WPF snapshots
        shell: pwsh
        run: ./eng/capture-ui.ps1 -Configuration Release

      - name: Upload WPF snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DocPivot-ui-snapshots
          path: artifacts/ui-snapshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Restore Python tools from lock
        shell: pwsh
        run: ./eng/setup-python.ps1

      - name: Lint, type-check, and test Python worker
        shell: pwsh
        run: ./eng/test-python.ps1

      - name: Audit NuGet dependencies
        shell: pwsh
        run: ./eng/audit.ps1

      - name: Publish preview EXE
        shell: pwsh
        run: ./eng/publish-preview.ps1

      - name: Smoke-test preview EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./artifacts/preview/DocPivot.exe -PassThru
          try {
            if ($process.WaitForExit(10000)) {
              throw "Preview exited during startup with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              $process.Kill($true)
              if (-not $process.WaitForExit(10000)) {
                throw 'Preview process did not stop after the smoke test.'
              }
            }
            $process.Dispose()
          }

      - name: Upload preview EXE
        uses: actions/upload-artifact@v4
        with:
          name: DocPivot-preview
          path: artifacts/preview/DocPivot.exe
          if-no-files-found: error
          retention-days: 14
